[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playwright-turnstile"
version = "0.1.1"
description = "Solve Cloudflare Turnstile in Playwright by handing the token off to the Peak API instead of clicking the widget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Peak" }]
keywords = [
    "playwright",
    "cloudflare",
    "turnstile",
    "captcha",
    "solver",
    "bypass",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.30"]

[project.urls]
Source = "https://github.com/CircuitSavage/playwright-turnstile"
Homepage = "https://peak.fo/?utm_source=github&utm_medium=pypi&utm_campaign=packages&utm_content=playwright-turnstile"
Documentation = "https://peak.fo/docs/turnstile?utm_source=github&utm_medium=pypi&utm_campaign=packages&utm_content=playwright-turnstile"

[tool.hatch.build.targets.wheel]
packages = ["src/playwright_turnstile"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "examples", "tests"]
